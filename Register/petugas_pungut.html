<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrasi Petugas Pungut - ClassApp</title>
    <!-- Google Font 'Inter' -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      /* Menghilangkan arrow pada input type number */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      :root {
        --primary-color: #16a34a;
        --primary-hover: #15803d;
        --primary-light: #f0fdf4;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --input-bg: #f8fafc;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }

      /* --- CARD CONTAINER (Tengah Halaman) --- */
      .register-card {
        background-color: var(--card-bg);
        width: 100%;
        max-width: 500px;
        padding: 2.5rem;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }

      /* --- HEADER CARD --- */
      .app-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .app-logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-color);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .app-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 0.35rem;
      }

      .app-header p {
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      /* --- FORM & INPUT --- */
      .form-group {
        margin-bottom: 1.15rem;
      }

      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: var(--text-dark);
      }

      .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--input-bg);
        font-size: 0.9rem;
        color: var(--text-dark);
        transition: all 0.2s ease;
        outline: none;
      }

      .form-group input:focus {
        border-color: var(--primary-color);
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
      }

      /* --- AUTOCOMPLETE SEKOLAH --- */
      .autocomplete-wrapper {
        position: relative;
        width: 100%;
      }

      .autocomplete-items {
        position: absolute;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        border-top: none;
        z-index: 99;
        top: 100%;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow-y: auto;
        background-color: var(--card-bg);
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.05);
      }

      .autocomplete-item {
        padding: 10px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: background-color 0.2s;
        font-size: 0.9rem;
      }

      .autocomplete-item:hover {
        background-color: var(--input-bg);
      }

      .autocomplete-item img {
        width: 24px;
        height: 24px;
        object-fit: contain;
        border-radius: 4px;
      }

      /* --- SUBMIT BUTTON --- */
      .btn-submit {
        width: 100%;
        padding: 0.8rem;
        background-color: var(--primary-color);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
        margin-top: 0.5rem;
        display: block;
        text-align: center;
        text-decoration: none;
      }

      .btn-submit:hover {
        background-color: var(--primary-hover);
      }

      /* --- FOOTER CARD --- */
      .form-footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .form-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
      }

      .form-footer a:hover {
        text-decoration: underline;
      }

      /* Responsif untuk Layar Kecil */
      @media (max-width: 480px) {
        .register-card {
          padding: 1.75rem 1.25rem;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Centered Card Container -->
    <div class="register-card">
      <!-- Header -->
      <div class="app-header">
        <a href="#" class="app-logo">🌿 ClassApp</a>
        <h1>Buat Akun Petugas Pungut Baru</h1>
        <p>Silakan isi formulir di bawah ini untuk mendaftar.</p>
      </div>

      <!-- Form Registrasi -->
      <form action="../Login/petugas_pungut.html" method="POST">
        <!-- Field 1: Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username lengkap"
            required
          />
        </div>

        <!-- Field 3: Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>

        <!-- Field 4: Konfirmasi Password -->
        <div class="form-group">
          <label for="confirm_password">Konfirmasi Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="••••••••"
            required
          />
        </div>

        <!-- Tombol Submit -->
        <button type="submit" class="btn-submit">Daftar Sekarang</button>
      </form>

      <!-- Footer Card -->
      <div class="form-footer">
        Sudah memiliki akun?
        <a href="../Login/petugas_pungut.html">Masuk di sini</a>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrasi Admin Sekolah - Green Generation</title>
    <link rel="icon" href="../Icons/tea-leaf.png" type="image/png" />
    <!-- Menggunakan font Google 'Inter' agar tampilan terlihat modern & bersih -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      /* remove arrow field type number */

      /* Untuk Chrome, Safari, Edge, Opera */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Untuk Firefox */
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      :root {
        --primary-color: #16a34a; /* Hijau Utama */
        --primary-hover: #15803d; /* Hijau saat tombol di-hover */
        --bg-color: #f8fafc; /* Latar belakang halaman yang lembut */
        --card-bg: #ffffff; /* Putih untuk card */
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --input-bg: #f8fafc;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }

      /* Layout Utama (Card di Tengah) */
      .register-container {
        background-color: var(--card-bg);
        width: 100%;
        max-width: 500px;
        padding: 2.5rem;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }

      /* Bagian Kiri/Form (Sekarang di dalam Card) */
      .left-section {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      /* Header Aplikasi */
      .app-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .app-logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-color);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .app-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 0.35rem;
      }

      .app-header p {
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      /* Form & Input */
      .form-group {
        margin-bottom: 1.15rem;
      }

      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: var(--text-dark);
      }

      .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--input-bg);
        font-size: 0.9rem;
        color: var(--text-dark);
        transition: all 0.2s ease;
        outline: none;
      }

      .form-group input:focus {
        border-color: var(--primary-color);
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
      }

      /* field school auto complete */

      .autocomplete-wrapper {
        position: relative;
        width: 100%;
      }

      .autocomplete-items {
        position: absolute;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        border-top: none;
        z-index: 99;
        top: 100%;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow-y: auto;
        background-color: var(--card-bg);
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.05);
      }

      .autocomplete-item {
        padding: 10px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: background-color 0.2s;
        font-size: 0.9rem;
      }

      .autocomplete-item:hover {
        background-color: var(--input-bg);
      }

      .autocomplete-item img {
        width: 24px;
        height: 24px;
        object-fit: contain;
        border-radius: 4px;
      }

      /* Tombol Registrasi */
      .btn-submit {
        width: 100%;
        padding: 0.8rem;
        background-color: var(--primary-color);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
        margin-top: 0.5rem;
        display: block;
        text-align: center;
        text-decoration: none;
      }

      .btn-submit:hover {
        background-color: var(--primary-hover);
      }

      /* Footer Form (Masuk/Login link) */
      .form-footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .form-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
      }

      .form-footer a:hover {
        text-decoration: underline;
      }

      /* Bagian Kanan: Gambar (Dihilangkan untuk card tengah) */
      .right-section {
        display: none;
      }

      /* Responsif untuk Layar HP/Tablet */
      @media (max-width: 480px) {
        .register-container {
          padding: 1.75rem 1.25rem;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <!-- Bagian Kiri: Header & Form -->
      <div class="left-section">
        <div class="app-header">
          <!-- Nama Aplikasi -->
          <a href="#" class="app-logo">🌿 Green Generation</a>
          <h1>Buat Akun Admin Bank Baru</h1>
          <p>Silakan isi formulir di bawah ini untuk mendaftar.</p>
        </div>

        <form
          action="../Login/admin_bank.html"
          method="post"
          onsubmit="
            event.preventDefault();
            window.location.href = '../Login/admin_bank.html';
          "
        >
          <!-- Field 1: Nama -->
          <div class="form-group">
            <label for="username">Username </label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan Username "
              required
            />
          </div>

          <div class="form-group">
            <label for="bank">Bank asal</label>
            <div class="autocomplete-wrapper">
              <input
                type="text"
                id="bank"
                name="bank"
                placeholder="Ketik nama bank..."
                autocomplete="off"
                required
              />
              <!-- Container untuk daftar hasil pencarian -->
              <div id="bank-list" class="autocomplete-items"></div>
            </div>
          </div>

          <!-- Field 3: Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>

          <!-- Field 4: Konfirmasi Password -->
          <div class="form-group">
            <label for="confirm_password">Konfirmasi Password</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
            />
          </div>

          <!-- Tombol Submit -->
          <button type="submit" class="btn-submit">Daftar Sekarang</button>
        </form>

        <div class="form-footer">
          Sudah memiliki akun?
          <a href="../Login/admin_bank.html">Masuk di sini</a>
        </div>
      </div>
    </div>
    <script>
      // Data daftar sekolah (bisa ditambah atau diambil dari API)
      const dataBank = [
        {
          id: 1,
          nama: "BNI",
          logo: "https://via.placeholder.com/30?text=SMA1",
        },
        {
          id: 2,
          nama: "BRI",
          logo: "https://via.placeholder.com/30?text=SMA2",
        },
        {
          id: 3,
          nama: "BCA",
          logo: "https://via.placeholder.com/30?text=SMK1",
        },
        {
          id: 4,
          nama: "MANDIRI",
          logo: "https://via.placeholder.com/30?text=GARUDA",
        },
      ];

      const inputBank = document.getElementById("bank");
      const listContainer = document.getElementById("bank-list");

      inputBank.addEventListener("input", function () {
        const val = this.value.toLowerCase();
        listContainer.innerHTML = ""; // Bersihkan list sebelumnya

        if (!val) return;

        // Filter sekolah yang cocok
        const filtered = dataBank.filter((item) =>
          item.nama.toLowerCase().includes(val),
        );

        // Tampilkan hasil pencarian
        filtered.forEach((item) => {
          const div = document.createElement("div");
          div.classList.add("autocomplete-item");

          // Elemen Logo + Nama
          div.innerHTML = `
      <img src="${item.logo}" alt="Logo ${item.nama}" />
      <span>${item.nama}</span>
    `;

          // Event ketika item dipilih
          div.addEventListener("click", function () {
            inputBank.value = item.nama;
            listContainer.innerHTML = ""; // Sembunyikan list setelah dipilih
          });

          listContainer.appendChild(div);
        });
      });

      // Sembunyikan dropdown jika user mengklik di luar input
      document.addEventListener("click", function (e) {
        if (e.target !== inputBank) {
          listContainer.innerHTML = "";
        }
      });
    </script>
  </body>
</html>
